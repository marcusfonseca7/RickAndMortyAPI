<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rick and Morty</title>

    <link rel="stylesheet" href="styles.css" />

    <link rel="shortcut icon" href="img/favicon.png" type="image/x-icon" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <header></header>

    <main>

        <!-- https://media.giphy.com/media/v1.Y2lkPWVjZjA1ZTQ3c20zaWQxM3Vwd3MxeXh0bHZlbWZld2p3bnZtdjN4MXI3Nm5xYWYwZiZlcD12MV9zdGlja2Vyc19yZWxhdGVkJmN0PXM/pqojAJzs3FswE6Xzsu/giphy.gif -->
      <img class="element picle"
        src="https://media3.giphy.com/media/v1.Y2lkPTc5MGI3NjExY2l2MXZ2eGVtbzA5eGk2bG9sb2pjZDFzMmZ3OWRjcjcycm12dTJpMyZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9cw/2pWyYFawDKOf4QNNWY/giphy.gif"
        alt=""
      />
      <img
        class="element pistol-portal"
        src="https://media1.giphy.com/media/v1.Y2lkPTc5MGI3NjExbWpwdGhkc2d4OGR4Z2xtZ2g1MGY3OGZjNTY0NjN4anZlYXFuYWEzcyZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/3oriNTivEJZ1ASRnMc/giphy.gif"
        alt=""
      />
      <img
        class="background"
        src="img/fa16514fbec646d08f51e1bd5fdc6ab5.gif"
        alt=""
      />

      <form action="#">
        <div class="input-div">
          <select name="category" id="category">
            <option value="character">Personagem</option>
            <option value="episode">Episódio</option>
            <option value="location">Lugares</option>
          </select>

          <label for="input-character" id="label"
            >Digite o personagem que deseja ver as informações!
          </label>
          <input
            type="text"
            name="input-character"
            id="input-character"
            placeholder="Digite aqui..."
          />

          <button type="submit" id="botao">Ver infos</button>

        </div>

        <img alt="Personagem" id="avatar" width="150px">
        <p id="paragraph"></p>
      </form>
    </main>

    <footer></footer>

    <script src="script.js"></script>
  </body>
</html>
